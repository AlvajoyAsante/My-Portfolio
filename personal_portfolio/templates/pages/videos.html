{% block videos %}

<section class="videos section" id="videos">
    <h2 class="section__title">My YouTube</h2>
    <span class="section__subtitle">Recent</span>

    <div class="videos__container container grid">
        {% for video in videos %}
        <div class="videos__content">
            <div class="videos__iframe-wrapper" style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; background: #000; border-radius: .5rem;">
                <iframe 
                    src="https://www.youtube.com/embed/{{ video.youtube_id }}" 
                    title="{{ video.title }}"
                    style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    referrerpolicy="strict-origin-when-cross-origin" 
                    allowfullscreen>
                </iframe>
            </div>
            <h3 class="videos__title" style="margin-top: 1rem; font-size: var(--h3-font-size); font-weight: var(--font-medium);">{{ video.title }}</h3>
            <p class="videos__description" style="margin-bottom: 2rem;">{{ video.description }}</p>
        </div>
        {% empty %}
        <p>No videos available.</p>
        {% endfor %}
    </div>

</section>

{% endblock videos %}
