<!--==================== FOOTER ====================-->
{% load static %}

{% block footer %}
<footer class="footer">
    <div class="footer__bg">
        <div class="footer__container container grid">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <img src="{% static 'img/duck.png' %}" alt="Logo" style="width: 50px; height: 50px;">
                <div>
                    <h1 class="footer__title" style="margin-bottom: 0;">{{personal_info.first_name}}</h1>
                    <span class="footer__subtitle">{{personal_info.occupation}}</span>
                </div>
            </div>

            <ul class="footer__links">

                <li>
                    <a href="#portfolio" class="footer__link">Projects</a>
                </li>

                <li>
                    <a href="#videos" class="footer__link">YouTube</a>
                </li>

                <li>
                    <a href="#contact" class="footer__link">Contact</a>
                </li>
            </ul>

            <div class="footer__socials">

                <a href="{{personal_info.linkedin_link}}" target="_blank" class="footer__social">
                    <i class="uil uil-linkedin-alt"></i>
                </a>

                <a href="{{personal_info.github_link}}" target="_blank" class="footer__social">
                    <i class="uil uil-github-alt"></i>
                </a>

                <a href="{{personal_info.youtube_link}}" target="_blank" class="footer__social">
                    <i class="uil uil-youtube"></i>
                </a>

            </div>
        </div>

        <p class="footer__copy">&#169; {{personal_info.site_name}}. All right reserved</p>
    </div>
</footer>

{% endblock footer %}
