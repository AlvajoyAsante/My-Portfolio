{% block skills %}

<section class="skills section" id="skills">
    <h2 class="section__title">Skills</h2>
    <span class="section__subtitle">My technical level</span>

    <div class="skills__container container grid">
        {% for category in skill_categories %}
        <div class="skills__content skills__open">
            <div class="skills__header">
                <i class="{{ category.icon_class }} skills__icon"></i>

                <div>
                    <h1 class="skills__title">{{ category.name }}</h1>
                    <span class="skills__subtitle">{{ category.subtitle }}</span>
                </div>

                <i class="uil uil-angle-down skills__arrow"></i>
            </div>

            <div class="skills__list">
                {% for skill in category.skills.all %}
                    {% if skill.is_active %}
                    <div class="skills__data">
                        <i class="uil uil-check-circle skills__name-icon"></i>
                        <h3 class="skills__name">{{ skill.name }}</h3>
                    </div>
                    {% endif %}
                {% endfor %}
            </div>
        </div>
        {% endfor %}
    </div>
</section>

{% endblock skills %}
