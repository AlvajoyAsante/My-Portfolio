{% block contact %}

<section class="contact section" id="contact">
    <h2 class="section__title">Contact Me</h2>
    <span class="section__subtitle">Get in touch</span>

    <div class="contact__container container grid">
        <div>
            <div class="contact__information">
                <i class="uil uil-phone contact__icon"></i>
                <div>
                    <h3 class="contact__title">Call Me</h3>
                    <span class="contact__subtitle">{{personal_info.phone_number}}</span>
                </div>
            </div>

            <div class="contact__information">
                <i class="uil uil-envelope contact__icon"></i>
                <div>
                    <h3 class="contact__title">Email</h3>
                    <span class="contact__subtitle">{{personal_info.email}}</span>
                </div>
            </div>

            <div class="contact__information">
                <i class="uil uil-map-marker contact__icon"></i>
                <div>
                    <h3 class="contact__title">Location</h3>
                    <span class="contact__subtitle">{{personal_info.location}}</span>
                </div>
            </div>
        </div>

        <form id="contact-form" class="contact__form grid">
            <div class="contact__inputs grid">
                <div class="contact__content">
                    <label for="name" class="contact__label">Name</label>
                    <input type="text" id="name" class="contact__input" required />
                </div>
                <div class="contact__content">
                    <label for="email" class="contact__label">Email</label>
                    <input type="email" id="email" class="contact__input" required />
                </div>
            </div>
            <div class="contact__content">
                <label for="message" class="contact__label">Message</label>
                <textarea name="message" id="message" cols="0" rows="7" class="contact__input" required></textarea>
            </div>

            <div>
                <button type="submit" class="button button--flex" style="border: none; cursor: pointer;">
                    Send Message
                    <i class="uil uil-message button__icon"></i>
                </button>
            </div>
            <p id="form-status" style="margin-top: 1rem; font-size: var(--small-font-size);"></p>
        </form>
        <br>
    </div>
</section>

<script>
    document.getElementById('contact-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const message = document.getElementById('message').value;
        const status = document.getElementById('form-status');
        const button = this.querySelector('button');

        status.textContent = 'Sending...';
        status.style.color = 'var(--text-color)';
        button.disabled = true;

        fetch('/send-email/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ name, email, message })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                status.textContent = data.message;
                status.style.color = 'green';
                document.getElementById('contact-form').reset();
            } else {
                status.textContent = data.message;
                status.style.color = 'red';
            }
        })
        .catch(error => {
            status.textContent = 'An error occurred. Please try again.';
            status.style.color = 'red';
        })
        .finally(() => {
            button.disabled = false;
        });
    });
</script>

{% endblock contact %}
