<!-- templates/base.html -->
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--==================== SEO METADATA ====================-->
    <meta name="description" content="Portfolio of Alvajoy Asante - Full Stack Software Engineer specializing in Django, Python, and Cloud Technologies. View my projects, skills, and experience.">
    <meta name="keywords" content="Alvajoy, Portfolio, Software Engineer, Django, Python, Web Development, Google Cloud, Full Stack Developer, Backend, Frontend, JavaScript, HTML5, CSS3, PostgreSQL, Docker, Cloud Computing, REST API, Git, CI/CD, Agile">
    <meta name="author" content="Alvajoy">
    <meta name="robots" content="index, follow">

    <!--==================== CANONICAL URL ====================-->
    <link rel="canonical" href="https://alvajoyasante.com/">

    <!--==================== ADDITIONAL META ====================-->
    <meta name="theme-color" content="#E69C58">
    <meta property="og:site_name" content="Alvajoy's Portfolio">
    <meta property="og:locale" content="en_US">
    <meta name="application-name" content="Alvajoy's Portfolio">
    <meta name="format-detection" content="telephone=no">

    <!--==================== APPLE / IOS ====================-->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Alvajoy">

    <!--==================== MICROSOFT ====================-->
    <meta name="msapplication-navbutton-color" content="#E69C58">
    <meta name="msapplication-TileColor" content="#E69C58">

    <!--==================== OPEN GRAPH / FACEBOOK ====================-->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://alvajoyasante.com/">
    <meta property="og:title" content="Alvajoy's Portfolio">
    <meta property="og:description" content="Full Stack Software Engineer specializing in Django, Python, and Cloud Technologies.">
    <meta property="og:image" content="{% static 'img/preview-image.png' %}">

    <!--==================== TWITTER ====================-->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://alvajoyasante.com/">
    <meta property="twitter:title" content="Alvajoy's Portfolio">
    <meta property="twitter:description" content="Full Stack Software Engineer specializing in Django, Python, and Cloud Technologies.">
    <meta property="twitter:image" content="{% static 'img/preview-image.png' %}">

    <title>Alvajoy's Portfolio</title>
    <!--==================== WEBSITE ICON ====================-->
    <link rel="icon"  href="{% static 'img/fav.ico' %}">

    <!--==================== UNICONS ====================-->
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v3.0.6/css/line.css" />

    <!--==================== SWIPER CSS====================-->
    <link rel="stylesheet" href="{% static 'css/swiper-bundle.min.css' %}" />

    <!--==================== CSS ==========-->
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />

    
</head>

<body>
    {% block page_content %}{% endblock page_content %}
</body>

</html>
